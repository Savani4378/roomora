<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="https://img.freepik.com/premium-photo/blue-neon-font-letter-r-3d-rendering-isolated-black-background_923894-41291.jpg?w=360">
  <title>Roomora | Register</title>
  <link rel="stylesheet" href="/register/form.css" />
</head>
<body>
  <div class="form-container">
    <h2>Create an Account</h2>
    <form action="register_process.php" method="POST">
      <input type="text" name="fullname" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <input type="tel" name="phone" placeholder="Phone Number" required />
      <input type="password" name="password" placeholder="Password" required />
      <input type="password" name="confirm_password" placeholder="Confirm Password" required />
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/register/login.html">Log in here</a>.</p>
  </div>
</body>
</html>
